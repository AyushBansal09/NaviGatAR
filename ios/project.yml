# Fallback only: NaviGatAR.xcodeproj is already committed and is what you
# should open. If Xcode ever refuses to open it, regenerate it with
#   brew install xcodegen && cd ios && xcodegen generate
name: NaviGatAR
options:
  deploymentTarget:
    iOS: "18.0"
targets:
  NaviGatAR:
    type: application
    platform: iOS
    sources:
      - path: NaviGatAR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ayushbansal09.navigatar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: NaviGatAR-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: NaviGatAR
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        INFOPLIST_KEY_NSCameraUsageDescription: NaviGatAR uses the camera to find QR signs and show AR directions. Camera images stay on your iPhone.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
